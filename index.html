<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЗЕРНО — генератор бесшовного шума</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Оформление. Порядок важен: токены → база → каркас → компоненты. -->
<link rel="stylesheet" href="static/css/tokens.css">
<link rel="stylesheet" href="static/css/base.css">
<link rel="stylesheet" href="static/css/layout.css">
<link rel="stylesheet" href="static/css/components/topbar.css">
<link rel="stylesheet" href="static/css/components/buttons.css">
<link rel="stylesheet" href="static/css/components/sections.css">
<link rel="stylesheet" href="static/css/components/fields.css">
<link rel="stylesheet" href="static/css/components/color-editor.css">
<link rel="stylesheet" href="static/css/components/channels.css">
<link rel="stylesheet" href="static/css/components/stage.css">
<link rel="stylesheet" href="static/css/components/library.css">
<link rel="stylesheet" href="static/css/components/status.css">
<link rel="stylesheet" href="static/css/components/toast.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">
      <span class="mark">ЗЕР<b>Н</b>О</span>
      <span class="sub">бесшовный шум · okhsl</span>
    </div>
    <div class="bar-mid">
      <input id="docName" class="name-input" spellcheck="false" placeholder="имя пресета">
    </div>
    <div class="bar-actions">
      <button class="btn" id="btnCss" title="Скопировать CSS с data-URI плитки">CSS</button>
      <button class="btn" id="btnImport">Импорт</button>
      <button class="btn" id="btnJson">JSON</button>
      <button class="btn" id="btnWebp">WEBP</button>
      <button class="btn acc" id="btnPng">PNG</button>
      <input type="file" id="fileJson" accept=".json,application/json" multiple hidden>
    </div>
  </header>

  <main class="grid" id="grid">

    <aside class="col" id="colLeft"></aside>

    <section class="stage">
      <div class="stage-bar">
        <div class="sgroup">
          <span>масштаб</span>
          <input type="range" class="zoom" id="zoom" min="-2" max="3" step="0.02" value="0">
          <span class="zval" id="zval">100%</span>
          <button class="btn sm" id="zreset">1:1</button>
        </div>
        <div class="sgroup">
          <span>фон</span>
          <div class="surr" id="surr"></div>
        </div>
        <div class="sgroup">
          <button class="btn sm" id="tGrid">Границы плиток</button>
          <button class="btn sm" id="tShift">Сдвиг ½</button>
          <button class="btn sm" id="tSmooth">Сглаживание</button>
        </div>
        <div class="sgroup" style="margin-left:auto">
          <button class="btn sm" id="tLib">Библиотека</button>
        </div>
      </div>
      <div class="stage-view" id="stageView">
        <div class="field-wrap" id="fieldWrap">
          <div class="field" id="field"></div>
          <div class="field-grid" id="fieldGrid"></div>
          <div class="ticks on" id="ticks"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </section>

    <aside class="col col-right" id="colRight">
      <div class="lib-h">
        <div class="lib-t">Библиотека <span class="cnt" id="libCount">0</span></div>
        <div class="lib-btns">
          <button class="btn sm" id="libDir" title="File System Access API — с записью обратно в папку">Папка</button>
          <button class="btn sm" id="libPick" title="Выбрать папку через file-input (работает везде)">Обзор…</button>
          <button class="btn sm" id="libSave" title="Сохранить текущий пресет в подключённую папку">Сохранить</button>
          <button class="btn sm" id="libReload">↻</button>
        </div>
      </div>
      <div class="lib-status" id="libStatus">Папка не подключена.</div>
      <div class="lib-grid" id="libGrid"></div>
      <input type="file" id="fileDir" webkitdirectory directory multiple hidden>
    </aside>

  </main>

  <footer class="status">
    <div class="it"><span class="dot" id="dot"></span><span id="stState">готов</span></div>
    <div class="it">плитка <b id="stTile">—</b></div>
    <div class="it">каналов <b id="stCh">0</b></div>
    <div class="it">рендер <b id="stMs">—</b></div>
    <div class="it">движок <b id="stEngine">—</b></div>
    <div class="it" id="stSeam">стыковка: <b style="color:var(--ok)">точная</b></div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<!-- Обычные скрипты, а не модули: страница должна работать и по file://,
     где ES-модули запрещены политикой источника. Порядок — снизу вверх по
     зависимостям: движок → документ → интерфейс → запуск. -->
<script src="static/js/color.js"></script>
<script src="static/js/lattice.js"></script>
<script src="static/js/field.js"></script>
<script src="static/js/shape.js"></script>
<script src="static/js/composite.js"></script>
<script src="static/js/dither.js"></script>
<script src="static/js/doc.js"></script>
<script src="static/js/ui-kit.js"></script>
<script src="static/js/panels.js"></script>
<script src="static/js/engine.js"></script>
<script src="static/js/render.js"></script>
<script src="static/js/library.js"></script>
<script src="static/js/transfer.js"></script>
<script src="static/js/boot.js"></script>
</body>
</html>

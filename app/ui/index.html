<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZERNO</title>

<!-- Оформление. Порядок важен: шрифты → токены → база → каркас → компоненты. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/topbar.css">
<link rel="stylesheet" href="css/components/buttons.css">
<link rel="stylesheet" href="css/components/sections.css">
<link rel="stylesheet" href="css/components/fields.css">
<link rel="stylesheet" href="css/components/color-editor.css">
<link rel="stylesheet" href="css/components/channels.css">
<link rel="stylesheet" href="css/components/stage.css">
<link rel="stylesheet" href="css/components/library.css">
<link rel="stylesheet" href="css/components/status.css">
<link rel="stylesheet" href="css/components/toast.css">
<link rel="stylesheet" href="css/components/help.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">
      <span class="mark" id="brandMark"></span>
      <span class="sub" data-i18n="app.sub"></span>
    </div>
    <div class="bar-group">
      <button class="btn icon" id="btnUndo" disabled>↶</button>
      <button class="btn icon" id="btnRedo" disabled>↷</button>
    </div>
    <div class="bar-mid">
      <div class="name-wrap" id="nameWrap">
        <input id="docName" class="name-input" spellcheck="false" data-i18n-ph="doc.namePh">
        <span class="dirty-dot"></span>
      </div>
      <span class="file-name" id="fileName"></span>
    </div>
    <div class="bar-group">
      <button class="btn" id="btnOpen" data-i18n="bar.open"></button>
      <button class="btn" id="btnSave" data-i18n="bar.save"></button>
      <button class="btn" id="btnSaveAs" data-i18n="bar.saveAs"></button>
    </div>
    <div class="bar-sep"></div>
    <div class="bar-group">
      <button class="btn" id="btnCss">CSS</button>
      <button class="btn" id="btnWebp">WEBP</button>
      <button class="btn acc" id="btnPng">PNG</button>
    </div>
    <div class="bar-sep"></div>
    <select class="lang-sel" id="lang"></select>
    <button class="btn icon" id="btnHelp" data-help="start">?</button>
  </header>

  <main class="grid" id="grid">

    <aside class="col" id="colLeft"></aside>

    <section class="stage" id="stage">
      <div class="stage-bar">
        <div class="sgroup">
          <span data-i18n="stage.zoom"></span>
          <input type="range" class="zoom" id="zoom" min="-2" max="3" step="0.02" value="0">
          <span class="zval" id="zval">100%</span>
          <button class="btn sm" id="zreset">1:1</button>
        </div>
        <div class="sgroup">
          <span data-i18n="stage.surround"></span>
          <div class="surr" id="surr"></div>
        </div>
        <div class="sgroup">
          <button class="btn sm" id="tGrid" data-i18n="stage.grid"></button>
          <button class="btn sm" id="tShift" data-i18n="stage.shift"></button>
          <button class="btn sm" id="tSmooth" data-i18n="stage.smooth"></button>
        </div>
        <div class="sgroup end">
          <button class="help-i" data-help="stage">?</button>
          <button class="btn sm" id="tLib" data-i18n="stage.lib"></button>
        </div>
      </div>
      <div class="stage-view" id="stageView">
        <canvas class="field" id="field"></canvas>
      </div>
    </section>

    <aside class="col col-right" id="colRight">
      <div class="lib-h">
        <div class="lib-t"><span data-i18n="lib.title"></span> <span class="cnt" id="libCount">0</span> <button class="help-i" data-help="lib">?</button></div>
        <div class="lib-btns">
          <button class="btn sm" id="libDir" data-i18n="lib.dir"></button>
          <button class="btn sm" id="libReveal">↗</button>
          <button class="btn sm" id="libReload">↻</button>
        </div>
      </div>
      <div class="lib-status" id="libStatus"></div>
      <div class="lib-grid" id="libGrid"></div>
    </aside>

  </main>

  <footer class="status">
    <div class="it"><span class="dot" id="dot"></span><span id="stState"></span></div>
    <div class="it"><span data-i18n="st.tile"></span> <b id="stTile">—</b></div>
    <div class="it"><span data-i18n="st.channels"></span> <b id="stCh">0</b></div>
    <div class="it"><span data-i18n="st.render"></span> <b id="stMs">—</b></div>
    <div class="it"><span data-i18n="st.engine"></span> <b id="stEngine">—</b></div>
    <div class="it"><span data-i18n="st.seam"></span> <b style="color:var(--ok)" data-i18n="st.seamExact"></b></div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<!-- Справка. Статьи — в словаре языка (help), help.js вставляет их сюда и строит оглавление.
     Значок «?» у группы открывает её раздел; F1 или «?» сверху — «Начало».
     Закрывается ✕, Esc или кликом мимо окна. -->
<div class="help" id="help" hidden>
  <div class="help-box" role="dialog" aria-labelledby="helpTitle">
    <div class="help-h">
      <span class="help-t" id="helpTitle" data-i18n="help.title"></span>
      <button class="ibtn" id="helpClose">✕</button>
    </div>
    <div class="help-main">
      <nav class="help-nav" id="helpNav"></nav>
      <div class="help-body" id="helpBody"></div>
    </div>
  </div>
</div>

<!-- Обычные скрипты, а не модули: общая глобальная область, порядок — снизу
     вверх по зависимостям. Считает Rust (window.__TAURI__), здесь только
     интерфейс и модель документа. -->
<script src="js/i18n.js"></script>
<script src="i18n/ru.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/fr.js"></script>
<script src="i18n/es.js"></script>
<script src="i18n/pt-BR.js"></script>
<script src="i18n/uk.js"></script>
<script src="i18n/zh-CN.js"></script>
<script src="i18n/ja.js"></script>
<script src="i18n/ko.js"></script>
<script src="js/color.js"></script>
<script src="js/model.js"></script>
<script src="js/doc.js"></script>
<script src="js/ui-kit.js"></script>
<script src="js/help.js"></script>
<script src="js/history.js"></script>
<script src="js/panels.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/library.js"></script>
<script src="js/transfer.js"></script>
<script src="js/keys.js"></script>
<script src="js/boot.js"></script>
</body>
</html>

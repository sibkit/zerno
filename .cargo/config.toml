# x86-64-v2 (SSE4.2, POPCNT) — минимум, который требует сама Windows 11 24H2.
# Без SSE4.1 `f64::floor` компилируется в вызов функции, а не в `roundsd`, и
# решётки шума (floor в каждом семпле) теряют 30–50 % скорости. На результат
# не влияет: Rust не сливает умножение и сложение в FMA сам, округление то же.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]
